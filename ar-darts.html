<title>ARダーツ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: full-screen canvas game. Camera feed (or a room backdrop) behind a canvas; HUD pinned to the safe areas; overlays as centred sheets. */
:root{
  --bg:#14110f; --ink:#f4eee0; --mute:#a99f8d; --cream:#eadfc4; --red:#e2433a; --green:#1f8a4c; --gold:#ffc83d;
  --panel:rgba(20,17,15,.86);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#hud small{display:block;font-size:11px;letter-spacing:.14em;color:var(--cream);opacity:.85}
#hud b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
#hud .r{text-align:right}
#pips{display:flex;gap:7px;padding-top:12px}
#pips i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
#pips i.off{background:transparent;box-shadow:0 0 0 2px rgba(244,238,224,.5)}
#msg{position:fixed;left:0;right:0;top:40%;text-align:center;pointer-events:none;padding:0 16px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#msg b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,10vw,48px);line-height:1.1;color:var(--gold)}
#msg span{display:block;margin-top:6px;font-size:16px;font-weight:700;color:var(--ink)}
#msg.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
#msg.miss b{color:#d9d2c2}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
#hint{font-size:13px;font-weight:700;color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,.9);max-width:70%}
button{font:inherit;font-weight:700;border:0;cursor:pointer}
#re{pointer-events:auto;background:rgba(20,17,15,.7);color:var(--ink);border:1px solid rgba(244,238,224,.35);border-radius:999px;padding:9px 14px;font-size:13px}
#tg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 72px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#tg[hidden]{display:none}
#tg button{background:rgba(20,17,15,.7);color:var(--mute);border:1px solid rgba(244,238,224,.3);border-radius:999px;padding:7px 12px;min-height:34px;font-size:12px}
#tg button.on{color:var(--gold);border-color:var(--gold)}
#tg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;box-sizing:border-box;background:var(--cream);color:#1b1713;border-radius:14px;padding:15px 18px;font-size:17px}
.btn.sub{background:transparent;color:var(--cream);border:1px solid rgba(234,223,196,.4);font-size:15px}
.btn:focus-visible,#re:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(12,10,8,.55)}
#ov[hidden]{display:none}
.sheet{width:100%;max-width:380px;background:var(--panel);border:1px solid rgba(234,223,196,.18);border-radius:20px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet h1{margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;letter-spacing:.01em}
.sheet h1 em{font-style:normal;color:var(--red)}
.sheet p{margin:0;font-size:15px;line-height:1.7;color:#d8d0bd}
.sheet ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.75;color:#d8d0bd}
.note{font-size:13px;color:var(--gold)}
.big{font-family:var(--display);font-size:64px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-size:22px}
.row{display:flex;gap:12px;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#msg.pop{animation:none}}
</style>

<video id="cam" playsinline muted autoplay hidden></video>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div><small>ROUND</small><b id="rd">1/5</b></div>
  <div id="pips" aria-label="残りのダーツ"></div>
  <div class="r"><small>SCORE</small><b id="sc">0</b></div>
</div>
<div id="msg" aria-live="polite"></div>
<div id="foot">
  <div id="hint"></div>
  <button id="re" hidden>ボードを置き直す</button>
</div>
<div id="tg" hidden>
  <button id="tb" type="button" aria-pressed="true">♪ BGM オン</button>
  <button id="ts" type="button" aria-pressed="true">効果音 オン</button>
  <button id="td" type="button">台: スペース</button>
</div>
<div id="ov"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var cv=$("c"),ctx=cv.getContext("2d"),video=$("cam");
var rad=function(d){return d*Math.PI/180};
var wrap=function(a){return ((a+180)%360+360)%360-180};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var gauss=function(){return (Math.random()+Math.random()+Math.random()-1.5)*1.4};
var ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
var D=700, ROUNDS=5, PER=3;

var W,H,F,S,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.min(W,H)*1.0; S=F/D;
}
window.addEventListener("resize",resize);resize();

/* ---------- state ---------- */
var stage="intro";      // intro | place | play | end
var useCam=false, sensor=false, gotSensor=false;
var yaw=0,pitch=0,tYaw=0,tPitch=0,bYaw=0,bPitch=0;
var score=0,round=1,left=PER,roundSum=0,stuck=[],flying=null,wobble=0,locked=false,total=[];
var hitPts=null,hitLab="",hitT=0;
var best=0;
try{best=parseInt(localStorage.getItem("ar-darts-best")||"0",10)||0}catch(e){}

/* ---------- audio ---------- */
var ac=null,sfxBus=null,bgmBus=null,noiseBuf=null;
var pref={bgm:true,se:true};
try{
  if(localStorage.getItem("ar-darts-bgm")==="0")pref.bgm=false;
  if(localStorage.getItem("ar-darts-se")==="0")pref.se=false;
}catch(e){}
function ensureAc(){
  if(ac)return ac;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    sfxBus=ac.createGain();sfxBus.gain.value=pref.se?1:0;sfxBus.connect(ac.destination);
    bgmBus=ac.createGain();bgmBus.gain.value=pref.bgm?0.5:0;bgmBus.connect(ac.destination);
    var n=ac.sampleRate,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    noiseBuf=b;
  }catch(e){ac=null}
  if(ac&&ac.state==="suspended")ac.resume();
  return ac;
}
function tone(bus,f,t,dur,type,g,f2){
  var o=ac.createOscillator(),G=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  G.gain.setValueAtTime(0.0001,t);
  G.gain.exponentialRampToValueAtTime(g,t+0.01);
  G.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(G);G.connect(bus);o.start(t);o.stop(t+dur+0.05);
}
function noise(bus,t,dur,g,freq,type,q){
  var s=ac.createBufferSource(),f=ac.createBiquadFilter(),G=ac.createGain();
  s.buffer=noiseBuf;f.type=type||"highpass";f.frequency.value=freq;if(q)f.Q.value=q;
  G.gain.setValueAtTime(g,t);G.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(G);G.connect(bus);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);
}
function seClick(){
  if(!ensureAc()||!pref.se)return;
  tone(sfxBus,700,ac.currentTime,0.07,"triangle",0.15,420);
}
function seThrow(){
  if(!ensureAc()||!pref.se)return;
  var t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),G=ac.createGain();
  s.buffer=noiseBuf;f.type="bandpass";f.Q.value=2;
  f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(3200,t+0.3);
  G.gain.setValueAtTime(0.0001,t);G.gain.exponentialRampToValueAtTime(0.22,t+0.12);G.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
  s.connect(f);f.connect(G);G.connect(sfxBus);s.start(t);s.stop(t+0.36);
}
function seBull(t){
  tone(sfxBus,2600,t,0.38,"sawtooth",0.28,120);
  tone(sfxBus,1300,t,0.38,"square",0.12,60);
  noise(sfxBus,t,0.12,0.5,1200,"highpass");
  tone(sfxBus,160,t,0.35,"sine",0.7,35);
  tone(sfxBus,3200,t+0.12,0.5,"sine",0.12,700);
  tone(sfxBus,3800,t+0.22,0.45,"sine",0.09,900);
}
function seStick(j){
  if(!ensureAc()||!pref.se)return;
  var t=ac.currentTime;
  if(j.miss){tone(sfxBus,140,t,0.2,"sine",0.5,50);noise(sfxBus,t,0.08,0.25,600,"lowpass");return}
  noise(sfxBus,t,0.05,0.7,1800,"highpass");
  tone(sfxBus,230,t,0.16,"sine",0.8,70);
  tone(sfxBus,95,t,0.22,"triangle",0.6,45);
  tone(sfxBus,1900,t,0.12,"square",0.05,1500);
  if(j.bull){seBull(t)}
  else if(/^(TRIPLE|DOUBLE)/.test(j.big)){tone(sfxBus,1046.5,t+0.07,0.45,"sine",0.14);tone(sfxBus,1568,t+0.15,0.45,"sine",0.12)}
}
/* BGM: a slow lounge loop (Am7 / Dm7 / G7 / Cmaj7) made from oscillators */
var SP=60/92/2,bgm={timer:null,step:0,next:0};
var mtof=function(n){return 440*Math.pow(2,(n-69)/12)};
var CH=[{r:45,c:[57,60,64,67]},{r:38,c:[53,57,60,64]},{r:43,c:[55,59,62,65]},{r:48,c:[52,55,59,64]}];
function bgmStep(st,t){
  var bar=Math.floor(st/8),pos=st%8,ch=CH[Math.floor(bar/2)%4];
  if(pos===0)ch.c.forEach(function(n){tone(bgmBus,mtof(n),t,SP*7.5,"triangle",0.035)});
  if(pos===0||pos===3||pos===6)tone(bgmBus,mtof(ch.r),t,SP*1.6,"sine",0.22);
  if(pos===0||pos===4)tone(bgmBus,110,t,0.14,"sine",0.3,42);
  if(pos===4)noise(bgmBus,t,0.12,0.07,1500,"bandpass",1);
  noise(bgmBus,t,0.04,pos%2?0.045:0.02,7000,"highpass");
  if(pos%2===1||pos===2)tone(bgmBus,mtof(ch.c[(st*3+bar)%4]+12),t,0.35,"triangle",0.05);
}
function sched(){
  if(!ac)return;
  if(bgm.next<ac.currentTime-0.5)bgm.next=ac.currentTime+0.1;
  while(bgm.next<ac.currentTime+0.3){bgmStep(bgm.step,bgm.next);bgm.next+=SP;bgm.step=(bgm.step+1)%64}
}
function startBgm(){
  if(!pref.bgm||bgm.timer||!ensureAc())return;
  bgm.next=ac.currentTime+0.15;bgm.timer=setInterval(sched,60);
}
function stopBgm(){clearInterval(bgm.timer);bgm.timer=null}
function applyPref(){
  var tb=$("tb"),ts=$("ts");
  tb.textContent=pref.bgm?"♪ BGM オン":"♪ BGM オフ";tb.className=pref.bgm?"on":"";tb.setAttribute("aria-pressed",String(pref.bgm));
  ts.textContent=pref.se?"効果音 オン":"効果音 オフ";ts.className=pref.se?"on":"";ts.setAttribute("aria-pressed",String(pref.se));
}
function savePref(){try{localStorage.setItem("ar-darts-bgm",pref.bgm?"1":"0");localStorage.setItem("ar-darts-se",pref.se?"1":"0")}catch(e){}}
$("tb").addEventListener("click",function(){
  pref.bgm=!pref.bgm;savePref();ensureAc();
  if(bgmBus)bgmBus.gain.value=pref.bgm?0.5:0;
  if(pref.bgm)startBgm();else stopBgm();
  applyPref();
});
$("ts").addEventListener("click",function(){
  pref.se=!pref.se;savePref();ensureAc();
  if(sfxBus)sfxBus.gain.value=pref.se?1:0;
  applyPref();seClick();
});
document.addEventListener("visibilitychange",function(){
  if(!ac)return;
  if(document.hidden)ac.suspend();else ac.resume();
});
applyPref();

/* ---------- projection ---------- */
function boardPos(){
  var dy=wrap(bYaw-yaw),dp=pitch-bPitch;
  if(Math.abs(dy)>80||Math.abs(dp)>80)return null;
  return {x:W/2+F*Math.tan(rad(dy)),y:H/2+F*Math.tan(rad(dp))};
}
function aimOffset(){
  return {x:D*Math.tan(rad(wrap(yaw-bYaw))),y:D*Math.tan(rad(pitch-bPitch))};
}

/* ---------- sensors ---------- */
var oriSrc=null;
/* Camera direction from the full rotation (no gimbal problem when the phone is held upright) */
function onOri(e){
  if(e.beta==null||e.gamma==null)return;
  if(oriSrc===null){
    if(e.alpha!=null)oriSrc=e.type;
    else if(e.type==="deviceorientationabsolute")oriSrc=e.type;
    else return;
  }
  if(e.type!==oriSrc)return;
  var a=rad(e.alpha||0),b=rad(e.beta),g=rad(e.gamma);
  var cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g);
  var E=-(cA*sG+cG*sA*sB),N=-(sA*sG-cA*cG*sB),U=-(cB*cG);
  var h=Math.atan2(E,N)*180/Math.PI;
  var p=clamp(Math.asin(clamp(U,-1,1))*180/Math.PI,-60,60);
  if(!gotSensor){gotSensor=true;yaw=h;pitch=p}
  tYaw=h;tPitch=p;
}
function waitSensor(ms){
  return new Promise(function(res){
    if(gotSensor)return res(true);
    var t0=Date.now();
    (function poll(){
      if(gotSensor)return res(true);
      if(Date.now()-t0>ms)return res(false);
      setTimeout(poll,60);
    })();
  });
}
async function startAR(wantCam){
  var s=false,c=false;
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      var r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted")throw new Error("denied");
    }
    window.addEventListener("deviceorientation",onOri,true);
    window.addEventListener("deviceorientationabsolute",onOri,true);
    s=await waitSensor(1200);
  }catch(e){s=false}
  if(wantCam)try{
    var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    video.srcObject=st;video.hidden=false;await video.play();c=true;
  }catch(e){c=false;video.hidden=true}
  useCam=c;sensor=s;
  begin(!c||!s);
}
function startPlain(){useCam=false;sensor=false;begin(false)}

function begin(degraded){
  seClick();startBgm();
  if(sensor){
    stage="place";
    showOv('<div class="sheet"><h1>ボードを<em>置く</em></h1><p>ダーツボードを置きたい場所にスマホを向けて、ボタンを押してください。</p>'+
      (useCam?'':'<p class="note">カメラなしで、部屋の背景の上に表示します。</p>')+
      '<button class="btn" data-a="place">ここに置く</button></div>');
  }else{
    bYaw=yaw=tYaw=0;pitch=tPitch=0;bPitch=-4;
    if(degraded&&stage==="intro"){}
    startGame(true);
  }
}
function placeBoard(){
  bYaw=yaw;bPitch=pitch;
  hideOv();startGame(false);
}

/* ---------- game flow ---------- */
function startGame(look){
  stage="play";score=0;round=1;left=PER;roundSum=0;stuck=[];flying=null;locked=false;total=[];hitPts=null;hitLab="";
  hideOv();$("hud").hidden=false;$("tg").hidden=false;$("re").hidden=!sensor;
  $("hint").textContent=sensor?"スマホを動かして狙い、上へすばやくフリック":(window.top!==window.self?"この画面では傾きセンサーが使えません。ブラウザで直接開いてください。":"傾きセンサーが使えないため、ドラッグで狙います。")+"上へすばやくフリックで投げる";
  updHUD();say("","");
}
function updHUD(){
  $("rd").textContent=Math.min(round,ROUNDS)+"/"+ROUNDS;
  $("sc").textContent=score;
  var h="";for(var i=0;i<PER;i++)h+='<i class="'+(i<left?"":"off")+'"></i>';
  $("pips").innerHTML=h;
}
function say(big,sub,miss){
  var m=$("msg");
  m.className="";
  if(!big){m.innerHTML="";return}
  m.innerHTML="<b>"+big+"</b><span>"+(sub||"")+"</span>";
  void m.offsetWidth;
  m.className="pop"+(miss?" miss":"");
}

function judge(x,y){
  var r=Math.hypot(x,y);
  if(r<=6.35)return {pts:50,big:"BULL",sub:"50点",bull:true};
  if(r<=15.9)return {pts:25,big:"OUTER BULL",sub:"25点",bull:true};
  if(r>170)return {pts:0,big:"MISS",sub:"ボードの外",miss:true};
  var a=Math.atan2(x,y)*180/Math.PI;if(a<0)a+=360;
  var n=ORDER[Math.floor(((a+9)%360)/18)];
  if(r>=99&&r<=107)return {pts:n*3,big:"TRIPLE "+n,sub:n*3+"点"};
  if(r>=162)return {pts:n*2,big:"DOUBLE "+n,sub:n*2+"点"};
  return {pts:n,big:String(n),sub:n+"点"};
}

function land(){
  var f=flying;flying=null;
  var j=judge(f.x,f.y);
  hitPts=j.pts;hitLab=/^\d+$/.test(j.big)?"SINGLE "+j.big:j.big;hitT=performance.now();
  if(Math.max(Math.abs(f.x),Math.abs(f.y))<=385)stuck.push({x:f.x,y:f.y,c:j.bull?"#ffc83d":(stuck.length%2?"#e2433a":"#3aa8e2")});
  wobble=1;score+=j.pts;roundSum+=j.pts;
  seStick(j);
  say("","");
  updHUD();
  if(left===0){
    setTimeout(function(){
      say("ラウンド合計 "+roundSum,"ROUND "+round+" 終了");
      total.push(roundSum);
    },900);
    setTimeout(endRound,2400);
  }else locked=false;
}
function endRound(){
  stuck=[];roundSum=0;hitPts=null;hitLab="";
  if(round>=ROUNDS){finish();return}
  round++;left=PER;locked=false;say("","");updHUD();
}
function finish(){
  stage="end";$("hud").hidden=true;$("tg").hidden=true;$("re").hidden=true;say("","");
  var isBest=score>best;
  if(isBest){best=score;try{localStorage.setItem("ar-darts-best",String(best))}catch(e){}}
  var rank=score>=600?"マスター":score>=450?"エキスパート":score>=300?"アマチュア":score>=150?"ルーキー":"ビギナー";
  var rows="";for(var i=0;i<total.length;i++)rows+='<div class="row"><span>ROUND '+(i+1)+'</span><b>'+total[i]+'</b></div>';
  showOv('<div class="sheet"><div class="row"><span>TOTAL</span><span>'+(isBest?"ベスト更新!":"ベスト "+best)+'</span></div>'+
    '<div class="big">'+score+'</div><div class="rank">'+rank+'</div>'+rows+
    '<button class="btn" data-a="again">もう一度</button></div>');
}
function showOv(h){var o=$("ov");o.innerHTML=h;o.hidden=false}
function hideOv(){$("ov").hidden=true;$("ov").innerHTML=""}

/* ---------- throwing ---------- */
function throwDart(dx,dy,v){
  var ang=Math.atan2(dx,dy);
  var lat=Math.tan(clamp(ang,-0.5,0.5))*650+gauss()*5;
  var ver=clamp((v-1.5)*170,-230,230)+gauss()*5;
  var a=aimOffset();

  ctx.font=size+"px "+FD;ctx.textAlign="center";ctx.lineJoin="round";
  var g=ctx.createLinearGradient(0,-size/2,0,size/2);g.addColorStop(0,"#ffffff");g.addColorStop(0.55,"#c4cad6");g.addColorStop(1,"#7a8196");
  ctx.lineWidth=Math.max(2,7*S);ctx.strokeStyle="rgba(0,0,0,.65)";ctx.strokeText(txt,0,0);
  ctx.fillStyle=g;ctx.fillText(txt,0,0);ctx.restore();
  ctx.font="700 "+Math.max(9,Math.round(26*S))+"px "+FB;ctx.textAlign="center";
  ctx.fillStyle=hitPts===0?"#9aa3b8":"#ffd36b";ctx.fillText(lblText(),X(0),Y(-422));
  ctx.fillStyle="rgba(3,8,30,.8)";rr(X(-250),Y(462),R(500),R(98),R(12));ctx.fill();
  ctx.strokeStyle="#3b82ff";ctx.lineWidth=Math.max(1,2*S);ctx.stroke();
  ctx.font="700 "+Math.max(8,Math.round(21*S))+"px "+FB;ctx.fillStyle="#9fb4ff";
  ctx.textAlign="left";ctx.fillText("TOTAL",X(-226),Y(486));
  ctx.textAlign="right";ctx.fillText("LAST DART",X(226),Y(486));
  ctx.font=Math.max(14,Math.round(56*S))+"px "+FD;ctx.textAlign="left";ctx.fillStyle="#ffffff";ctx.fillText(String(score),X(-226),Y(528));
  ctx.textAlign="right";ctx.fillStyle="#ffd36b";ctx.fillText(String(hitPts==null?"--":hitPts),X(226),Y(528));
}
var mc=null,MX=480,MYT=740,MYB=910;
function drawMachine(cx,cy,now){
  fonts();
  var k=Math.min(DPR,2800/((MYT+MYB)*S));
  if(!mc||mc.S!==S||mc.k!==k||mc.d!==DESIGN){
    var c=document.createElement("canvas");
    c.width=Math.ceil(2*MX*S*k);c.height=Math.ceil((MYT+MYB)*S*k);
    var main=ctx;ctx=c.getContext("2d");ctx.setTransform(k,0,0,k,0,0);
    if(DESIGN==="space")paintSpace(MX*S,MYT*S);else paintArcade(MX*S,MYT*S);
    ctx=main;mc={S:S,k:k,d:DESIGN,c:c};
  }
  ctx.drawImage(mc.c,cx-MX*S,cy-MYT*S,2*MX*S,(MYT+MYB)*S);
  if(DESIGN==="space")textSpace(cx,cy,now);else textArcade(cx,cy,now);
}
function updDesign(){$("td").textContent="台: "+(DESIGN==="space"?"スペース":"アーケード")}
$("td").addEventListener("click",function(){
  DESIGN=DESIGN==="space"?"arcade":"space";
  try{localStorage.setItem("ar-darts-design",DESIGN)}catch(e){}
  updDesign();seClick();
});
updDesign();
function drawDart(x,y,k,col,fly){
  var sx=fly?0:5*k,sy=fly?34*k:22*k;
  ctx.save();ctx.lineCap="round";
  ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=3.2*k;ctx.beginPath();ctx.moveTo(x+2*k,y+2*k);ctx.lineTo(x+sx+2*k,y+sy+2*k);ctx.stroke();
  ctx.strokeStyle="#c9ccd2";ctx.lineWidth=2.4*k;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sx*0.45,y+sy*0.45);ctx.stroke();
  ctx.strokeStyle="#7d828c";ctx.lineWidth=5.2*k;ctx.beginPath();ctx.moveTo(x+sx*0.3,y+sy*0.3);ctx.lineTo(x+sx*0.72,y+sy*0.72);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();
  ctx.ellipse(x+sx,y+sy,12*k,fly?10*k:8*k,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.ellipse(x+sx-3*k,y+sy-2*k,4*k,3*k,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawCross(){
  var cx=W/2,cy=H/2,pulse=stage==="place"?4*Math.sin(performance.now()/180):0;
  ctx.save();ctx.strokeStyle="rgba(255,200,61,.95)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,16+pulse,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-26,cy);ctx.lineTo(cx-8,cy);ctx.moveTo(cx+8,cy);ctx.lineTo(cx+26,cy);
  ctx.moveTo(cx,cy-26);ctx.lineTo(cx,cy-8);ctx.moveTo(cx,cy+8);ctx.lineTo(cx,cy+26);ctx.stroke();
  ctx.restore();
}

var last=performance.now();
function frame(now){
  var dt=Math.min(50,now-last);last=now;
  if(sensor&&gotSensor){
    var ey=wrap(tYaw-yaw),ep=tPitch-pitch;
    if(Math.abs(ey)>0.3)yaw=wrap(yaw+ey*0.14);
    if(Math.abs(ep)>0.3)pitch+=ep*0.14;
  }
  wobble=Math.max(0,wobble-dt/700);
  ctx.clearRect(0,0,W,H);
  var bp=boardPos();
  if(!useCam)drawRoom(bp);
  if(stage!=="intro"&&stage!=="end"||stage==="end"){
    if(bp){
      drawMachine(bp.x,bp.y,now);
      drawBoard(bp.x,bp.y);
      for(var i=0;i<stuck.length;i++){
        var d=stuck[i],j=Math.sin(now/38+i)*wobble*1.6*S;
        drawDart(bp.x+d.x*S+j,bp.y-d.y*S,S,d.c,false);
      }
    }
    if(flying){
      var t=clamp((now-flying.t0)/flying.dur,0,1);
      if(!bp){land()}
      else{
        var ex=bp.x+flying.x*S,ey=bp.y-flying.y*S,sx=W/2,sy=H*1.0;
        var e=1-Math.pow(1-t,2);
        var px=sx+(ex-sx)*e,py=sy+(ey-sy)*e-Math.sin(Math.PI*t)*H*0.07;
        drawDart(px,py,S*(2.6-1.6*Math.pow(t,0.7)),"#3aa8e2",true);
        if(t>=1)land();
      }
    }
    if(stage==="play"||stage==="place")drawCross();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
